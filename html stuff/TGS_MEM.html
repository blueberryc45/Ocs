 <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Vũ Trụ OC - Fandom Wiki</title>
    <style>
        /* 1. TẠO MÀU NỀN & FONT CHỮ */
        :root {
            --bg-color: #8bd6ff;
            --card-bg: #ffffff;
            --accent-color: #4d8bff;
            --accent-hover: #4d8bff;
            --text-main: #094083;
            --text-bright: #4d8bff;
            --border-color: #8bd6ff; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 2. THANH ĐIỀU HƯỚNG (NAVBAR) */
        header {
            background-color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
            border-radius: 8px
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-hover);
            text-decoration: none;
            padding: 15px 0;
        }

        /* Menu điều hướng */
        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-item {
            position: relative;
        }

        .nav-item > a {
            color: var(--text-bright);
            text-decoration: none;
            padding: 18px 20px;
            display: block;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-item:hover > a {
            background-color: var(--accent-color);
        }

        /* Sub-menu (Menu xổ xuống cho từng mục World, Lore, OC) */
        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: var(--card-bg);
            min-width: 200px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            list-style: none;
            border-radius: 0 0 8px 8px;
        }

        .dropdown a {
            color: var(--text-main);
            padding: 10px 15px;
            display: block;
            text-decoration: none;
            border-bottom: 1px solid var(--border-color);
            transition: 0.2s;
        }

        .dropdown a:hover {
            background-color: rgba(122, 82, 179, 0.2);
            color: var(--text-bright);
            padding-left: 20px;
        }

        .nav-item:hover .dropdown {
            display: block;
        }

        /* 3. BỐ CỤC TRANG CHÍNH (MAIN CONTAINER) */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 320px; /* Cột bài viết bên trái rộng hơn, cột Infobox 320px bên phải */
            gap: 25px;
        }

        /* 4. NỘI DUNG BÀI VIẾT (ARTICLE CONTENT) */
        .article {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .wiki-title {
            font-size: 2.2rem;
            color: var(--text-bright);
            border-bottom: 3px dashed var(--accent-color);
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .section-header {
            font-size: 1.5rem;
            color: var(--accent-hover);
            border-bottom: 2px dashed var(--accent-color);
            margin: 25px 0 15px 0;
            padding-bottom: 1px;
        }

        .article p {
            margin-bottom: 15px;
            text-align: left;
        }

        .badge {
            background-color: var(--accent-color);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            vertical-align: middle;
        }

        /* Danh sách liên kết nhanh */
        .quick-links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            text-align: left;
        }

        .card h4 {
            color: var(--text-bright);
            margin-bottom: 8px;
        }

        .card a {
            color: var(--accent-hover);
            text-decoration: none;
            font-size: 0.9rem;
        }

        /* 5. CỘT INFOBOX NHÂN VẬT CHUẨN FANDOM WIKI (SIDEBAR) */
        .infobox {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            overflow: hidden;
            height: fit-content;
        }

        .infobox-title {
            background-color: var(--accent-color);
            color: var(--card-bg);
            text-align: center;
            padding: 12px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .infobox-image {
            width: 100%;
            height: 250px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }

        .infobox-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .infobox-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .infobox-table th, .infobox-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .infobox-table th {
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--accent-hover);
            width: 40%;
        }

        .infobox-table td {
            color: var(--text-bright);
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 20px;
            color: #8b949e;
            font-size: 0.85rem;
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
        }

        /* RESPONSIVE CHO MÀN HÌNH ĐIỆN THOẠI */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .nav-links {
                flex-wrap: wrap;
            }
        }
</style>
